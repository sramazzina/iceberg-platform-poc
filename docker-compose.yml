name: iceberg-lab

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POLARIS_DB_PASSWORD: ${POLARIS_DB_PASSWORD}
      NESSIE_DB_PASSWORD: ${NESSIE_DB_PASSWORD}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 30

  nessie:
    image: ${NESSIE_IMAGE}
    # Catalogs are off by default; COMPOSE_PROFILES in .env selects them (spec section 5.0).
    profiles: [nessie]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Version store: JDBC2 on the database nessie. Nessie creates its tables itself.
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: nessie
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: ${NESSIE_DB_PASSWORD}
      # Iceberg REST warehouse on the nessie/ prefix.
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: lab
      NESSIE_CATALOG_WAREHOUSES_LAB_LOCATION: s3://${S3_BUCKET}/nessie/
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: ${AWS_REGION}
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: ${S3_ENDPOINT:-}
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-false}
      # AWS default credential chain: the VM instance profile through IMDSv2.
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE: APPLICATION_GLOBAL
      # Optional static keys: empty on AWS, the default chain then falls through to the instance profile.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Spark signs its own S3 requests with the VM instance profile (spec section 5.3).
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REQUEST_SIGNING_ENABLED: "false"
      # The check calls S3 HeadBucket, which the prefix-scoped VM policy denies (NOTES.md D10).
      NESSIE_CATALOG_OBJECT_STORES_HEALTH_CHECK_ENABLED: "false"
      JAVA_OPTS_APPEND: -Xmx384m -XX:MaxDirectMemorySize=128m
    mem_limit: 1g
    ports:
      - "127.0.0.1:19120:19120"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/q/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  spark:
    build:
      context: ./spark
      args:
        SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE}
        ICEBERG_VERSION: ${ICEBERG_VERSION}
        ICEBERG_SPARK_RUNTIME_ARTIFACT: ${ICEBERG_SPARK_RUNTIME_ARTIFACT}
        ICEBERG_SPARK_RUNTIME_SHA1: ${ICEBERG_SPARK_RUNTIME_SHA1}
        ICEBERG_AWS_BUNDLE_SHA1: ${ICEBERG_AWS_BUNDLE_SHA1}
        AWSCLI_VERSION: ${AWSCLI_VERSION}
        LAB_UID: ${LAB_UID:-1000}
    image: iceberg-lab-spark:${ICEBERG_VERSION}
    init: true
    depends_on:
      # required: false lets spark start when the catalog is off.
      nessie:
        condition: service_healthy
        required: false
    environment:
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      # The catalogs that are on; the entrypoint renders their Spark configuration.
      LAB_CATALOGS: ${COMPOSE_PROFILES:-}
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./scenarios:/workspace/scenarios
      - ./tests:/workspace/tests:ro
      - ./secrets:/run/lab-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/api >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
